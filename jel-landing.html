:root {
  --navy: #0f1e33;
  --navy-2: #1a3254;
  --rojo: #d42e2e;
  --rojo-presionado: #b52222;
  --blanco: #ffffff;
  --gris: #f5f5f7;
  --gris-2: #eceef2;
  --borde: #c9cfda;
  --texto: #0f1e33;
  --texto-2: #5b6475;
  --error: #b42318;
  --error-fondo: #fff4f3;
  --ok: #1f7a4d;
  --radio: 14px;
  --margen: 20px;
  --fuente: 'Manrope', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color-scheme: light;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

body {
  min-height: 100vh;
  margin: 0;
  background: radial-gradient(130% 480px at 100% 0%, var(--navy-2) 0%, rgba(26, 50, 84, 0) 70%) no-repeat, var(--navy);
  color: var(--texto);
  font-family: var(--fuente);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}

[hidden] {
  display: none !important;
}

h1,
h2,
p {
  margin: 0;
}

[tabindex='-1']:focus {
  outline: none;
}

:focus-visible {
  outline: 3px solid rgba(212, 46, 46, 0.55);
  outline-offset: 2px;
}

.vista {
  width: 100%;
  max-width: 520px;
  min-height: 100vh;
  min-height: 100dvh;
  margin: 0 auto;
  animation: entrar 0.22s ease-out;
}

@keyframes entrar {
  from {
    opacity: 0;
    transform: translateY(6px);
  }
}

@media (prefers-reduced-motion: reduce) {
  .vista {
    animation: none;
  }
}

/* ---------- Inicio ---------- */

.vista-inicio {
  display: flex;
  flex-direction: column;
  padding: calc(env(safe-area-inset-top) + 40px) var(--margen) calc(env(safe-area-inset-bottom) + clamp(40px, 9vh, 96px));
  color: var(--blanco);
}

.inicio-marca {
  display: flex;
  flex: 1;
  flex-direction: column;
  justify-content: center;
  padding: 24px 4px 40px;
}

.logo {
  display: block;
  width: min(58vw, 230px);
  height: auto;
}

.raya {
  display: block;
  width: 44px;
  height: 5px;
  margin: 30px 0 20px;
  background: var(--rojo);
  transform: skewX(-24deg);
}

.vista-inicio h1 {
  max-width: 13ch;
  font-size: clamp(30px, 9vw, 40px);
  font-weight: 800;
  line-height: 1.08;
  letter-spacing: -0.025em;
}

.opciones {
  display: grid;
  gap: 12px;
}

.opcion {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  min-height: 76px;
  padding: 14px 16px 14px 24px;
  overflow: hidden;
  border-radius: var(--radio);
  background: var(--blanco);
  box-shadow: 0 10px 28px rgba(0, 0, 0, 0.22);
  color: var(--navy);
  font-size: 19px;
  font-weight: 800;
  line-height: 1.2;
  letter-spacing: -0.01em;
  text-decoration: none;
  transition: transform 0.12s ease, background-color 0.12s ease;
}

.opcion::before {
  position: absolute;
  top: 0;
  bottom: 0;
  left: 0;
  width: 6px;
  background: var(--rojo);
  content: '';
}

.opcion:active {
  transform: scale(0.985);
  background: var(--gris);
}

.chips {

/* Monto con moneda */
.monto {

}

}

/* ---------- Selector de auto (año, marca, modelo) ---------- */

.selector {

.bloqueado > label,

.logo-marca {

.hoja-cabecera {

  flex: none;

.grilla-anios {

  gap: 8px;

.hoja-vacio {

.hoja-libre {

.hoja-listo {

select:has(option[value='']:checked) {
